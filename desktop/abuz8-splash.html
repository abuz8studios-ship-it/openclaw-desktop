<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zait</title>
<style>
  :root {
    --bg: #0E1B2E; --panel: #13243b; --line: #22354f; --text: #e7eef8; --muted: #8fa3bd;
    --ok: #4fd1a5; --wait: #5b7394; --bad: #ff6b6b; --accent: #5CA5C8;
  }
  @media (prefers-color-scheme: light) { :root { --bg: #0E1B2E; } } /* the app chrome is always navy */
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  main { min-height: 100%; display: grid; place-items: center; padding: 24px; }
  .card { width: min(520px, 100%); }
  h1 { margin: 0 0 2px; font-size: 26px; font-weight: 650; letter-spacing: .2px; }
  .sub { margin: 0 0 22px; color: var(--muted); }
  .bar { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 0 0 18px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .35s ease; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  li { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; }
  li .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--wait); flex: none; }
  li.up .dot { background: var(--ok); }
  li.up { color: var(--text); } li:not(.up) { color: var(--muted); }
  li .name { flex: 1; } li .meta { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
  li:not(.up) .dot { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .foot { margin-top: 18px; display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
  .fail { margin-top: 16px; padding: 12px 14px; border: 1px solid var(--bad); border-radius: 8px; color: #ffd0d0; display: none; }
  @media (prefers-reduced-motion: reduce) { li:not(.up) .dot { animation: none; } .bar > i { transition: none; } }
</style>
</head>
<body>
<main>
  <div class="card" role="status" aria-live="polite">
    <h1>Zait</h1>
    <p class="sub" id="sub">Starting up. The interface appears as soon as the gateway is ready.</p>
    <div class="bar" aria-hidden="true"><i id="bar"></i></div>
    <ul id="list"></ul>
    <div class="fail" id="fail"></div>
    <div class="foot"><span id="count">0 / 0 ready</span><span id="elapsed">0 s</span></div>
  </div>
</main>
<script>
  // The body (electron-main) pushes status here: window.__boot({elapsed, items:[{id,label,up,port}], failed, note})
  var list = document.getElementById('list');
  var rows = {};
  window.__boot = function (s) {
    if (!s || !s.items) return;
    s.items.forEach(function (it) {
      var li = rows[it.id];
      if (!li) {
        li = document.createElement('li');
        li.innerHTML = '<span class="dot"></span><span class="name"></span><span class="meta"></span>';
        li.querySelector('.name').textContent = it.label;
        list.appendChild(li); rows[it.id] = li;
      }
      li.className = it.up ? 'up' : '';
      li.querySelector('.meta').textContent = it.up ? 'ready' : (it.port ? ':' + it.port : '');
    });
    var up = s.items.filter(function (i) { return i.up; }).length;
    document.getElementById('count').textContent = up + ' / ' + s.items.length + ' ready';
    document.getElementById('elapsed').textContent = Math.round(s.elapsed || 0) + ' s';
    document.getElementById('bar').style.width = Math.round(100 * up / Math.max(1, s.items.length)) + '%';
    if (s.note) document.getElementById('sub').textContent = s.note;
    var f = document.getElementById('fail');
    if (s.failed) { f.style.display = 'block'; f.textContent = s.failed; } else { f.style.display = 'none'; }
  };
</script>
</body>
</html>
